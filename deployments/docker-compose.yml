version: '3.8'

services:
  quickcart-db:
    image: postgres:16-alpine
    container_name: quickcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickcart
      POSTGRES_PASSWORD: quickcart_secret
      POSTGRES_DB: quickcart
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../migrations/000002_auth_refresh_tokens.up.sql:/docker-entrypoint-initdb.d/02_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickcart -d quickcart"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  quickcart-redis:
    image: redis:7-alpine
    container_name: quickcart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  quickcart-api-1:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: quickcart-api-1
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      APP_ENV: "development"
      LOG_LEVEL: "info"
      INSTANCE_ID: "api-instance-1"
      DATABASE_URL: "postgres://quickcart:quickcart_secret@quickcart-db:5432/quickcart?sslmode=disable"
      REDIS_URL: "redis://quickcart-redis:6379/0"
      DB_MAX_CONNS: "25"
      DB_MIN_CONNS: "5"
      RATE_LIMIT_REQUESTS: "10000"
      JWT_SECRET: "quickcart-dev-jwt-super-secret-key-32bytes-min"
      METRICS_TOKEN: "quickcart-metrics-scrape-token"
    depends_on:
      quickcart-db:
        condition: service_healthy
      quickcart-redis:
        condition: service_healthy
    networks:
      - quickcart-net

  quickcart-api-2:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: quickcart-api-2
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      APP_ENV: "development"
      LOG_LEVEL: "info"
      INSTANCE_ID: "api-instance-2"
      DATABASE_URL: "postgres://quickcart:quickcart_secret@quickcart-db:5432/quickcart?sslmode=disable"
      REDIS_URL: "redis://quickcart-redis:6379/0"
      DB_MAX_CONNS: "25"
      DB_MIN_CONNS: "5"
      RATE_LIMIT_REQUESTS: "10000"
      JWT_SECRET: "quickcart-dev-jwt-super-secret-key-32bytes-min"
      METRICS_TOKEN: "quickcart-metrics-scrape-token"
    depends_on:
      quickcart-db:
        condition: service_healthy
      quickcart-redis:
        condition: service_healthy
    networks:
      - quickcart-net

  quickcart-api-3:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: quickcart-api-3
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      APP_ENV: "development"
      LOG_LEVEL: "info"
      INSTANCE_ID: "api-instance-3"
      DATABASE_URL: "postgres://quickcart:quickcart_secret@quickcart-db:5432/quickcart?sslmode=disable"
      REDIS_URL: "redis://quickcart-redis:6379/0"
      DB_MAX_CONNS: "25"
      DB_MIN_CONNS: "5"
      RATE_LIMIT_REQUESTS: "10000"
      JWT_SECRET: "quickcart-dev-jwt-super-secret-key-32bytes-min"
      METRICS_TOKEN: "quickcart-metrics-scrape-token"
    depends_on:
      quickcart-db:
        condition: service_healthy
      quickcart-redis:
        condition: service_healthy
    networks:
      - quickcart-net

  quickcart-nginx:
    image: nginx:1.27-alpine
    container_name: quickcart-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - quickcart-api-1
      - quickcart-api-2
      - quickcart-api-3
    networks:
      - quickcart-net

  quickcart-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: quickcart-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - quickcart-api-1
      - quickcart-api-2
      - quickcart-api-3
    networks:
      - quickcart-net

  quickcart-grafana:
    image: grafana/grafana:10.4.0
    container_name: quickcart-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - quickcart-prometheus
    networks:
      - quickcart-net

volumes:
  postgres_data:
  redis_data:

networks:
  quickcart-net:
    driver: bridge
