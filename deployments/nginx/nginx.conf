user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Sanitize access logs: redact JWT access tokens passed via ?token= query parameter (e.g. SSE connections)
    map $request_uri $sanitized_request_uri {
        ~*(.*?)([\?&]token=)([^&]+)(.*) $1$2[REDACTED]$4;
        default $request_uri;
    }

    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $sanitized_request_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" upstream=$upstream_addr '
                         'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                         'req_id=$http_x_request_id';

    access_log /var/log/nginx/access.log sanitized;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream cluster of 3 QuickCart Go API instances
    upstream quickcart_cluster {
        server quickcart-api-1:8080 max_fails=3 fail_timeout=10s;
        server quickcart-api-2:8080 max_fails=3 fail_timeout=10s;
        server quickcart-api-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name localhost;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;

        # SSE Endpoint: Unbuffered streaming with keepalive for native EventSource
        location ~ ^/api/v1/orders/[^/]+/events$ {
            proxy_pass http://quickcart_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # General REST API routing & Swagger UI
        location / {
            proxy_pass http://quickcart_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
